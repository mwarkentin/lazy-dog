# Fail mode with an org policy link, for use as a required check once warn
# mode has shown what gets flagged. Copy to .github/workflows/ai-description-check.yml.
name: AI description check

on:
  # Safe only because this job never checks out or runs PR code.
  # synchronize matters for required checks: every new head commit needs a result.
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-description-check-${{ github.event.pull_request.number }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pin to a full commit SHA, e.g. mwarkentin/lazy-dog@<sha> # v1.0.0
      - uses: mwarkentin/lazy-dog@v1
        with:
          pangram-api-key: ${{ secrets.PANGRAM_API_KEY }}
          mode: fail
          metric: fraction_ai
          threshold: '0.5'
          skip-authors: getsantry, sentry-junior
          policy-url: https://example.com/ai-use-policy
          message-footer: |
            We check PR descriptions because reviewers rely on them to understand intent.
            See our [AI use policy]({{policy_url}}). Questions: #ops in Slack.
